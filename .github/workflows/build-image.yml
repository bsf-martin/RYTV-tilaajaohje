# Publishes the build image to the GitHub container registry (ghcr.io).
# Runs when docker/ changes, or by hand. The image is tagged with the Pandoc version
# (pandoc-3.14) and build-docs.yml uses that exact tag, so a build never changes under us.
name: Build image

on:
  push:
    branches: [ "main", "latex-pdf-image" ]
    paths: [ "docker/**", ".github/workflows/build-image.yml" ]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the Pandoc version from the Dockerfile
        id: v
        run: echo "pandoc=$(sed -n 's/^ARG PANDOC_VERSION=//p' docker/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rytv-imbuilder:pandoc-${{ steps.v.outputs.pandoc }}
            ghcr.io/${{ github.repository_owner }}/rytv-imbuilder:latest
