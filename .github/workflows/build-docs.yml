# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  release:
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-documentation:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # permissions
    permissions:
      contents: write
      pages: write
      id-token: write
      packages: read
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0
      #- name: Cache Docker images.
      #  uses: ScribeMD/docker-cache@0.3.3
      #  with:
      #    key: docker-${{ runner.os }}
      #- name: Check latest release
      #  id: last_release
      #  uses: mvesanen/get-latest-release@master
      #  with:
      #    myToken: ${{ github.token }}
      #    exclude_types: "prerelease,draft"
      #    view_top: 100
      #    ghRef : ${{ github.ref }}
      #- name: Print latest release info
      #  run: |
      #    echo "last_release_tag_name: ${{  steps.last_release.outputs.tag_name }}"
      #    echo "last_release_html_url: ${{  steps.last_release.outputs.html_url }}"
      #- name: Check out latest release tag
      #  if: ${{ steps.last_release.outputs.tag_name }}
      #  uses: actions/checkout@v4
      #  with:
      #    ref: ${{ steps.last_release.outputs.tag_name }}
      #    fetch-depth: 0
      #    path: lastrelease
      #- name: Switch to latest release tag 
      #  run: |
      #    cd ${{ github.workspace }}/lastrelease      
      #    git checkout -b  ${{ steps.last_release.outputs.tag_name }}
      - name: Build info
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to the container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the site and the PDF in the build image
        run: |
          docker run --rm -v "${{ github.workspace }}/main:/git" \
            -e BUILD_SHA=${{ steps.vars.outputs.short }} \
            -e BUILD_SHA_FULL=${{ github.sha }} \
            -e REPO_URL=https://github.com/${{ github.repository }} \
            ghcr.io/${{ github.repository_owner }}/rytv-imbuilder:pandoc-3.14 \
            sh scripts/build.sh
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          #auto enable github pages for repository
          enablement: true  
      - name: Upload generated pages
        uses: actions/upload-pages-artifact@v3
        with: 
          path: ./main/gh-pages 
      - name: Collect  artefacts 
        uses: actions/upload-artifact@v4
        with:
          name: Tilaajaohje (PDF)
          path: |
            ${{ github.workspace }}/main/artefact/RYTV-tilaajaohje.pdf
      - name: Release files
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ github.workspace }}/main/artefact/RYTV-tilaajaohje.pdf
  # Deployment job
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
